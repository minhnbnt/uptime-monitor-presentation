<svg width="100%" viewBox="0 0 680 400" role="img" style="" xmlns="http://www.w3.org/2000/svg">
<title style="fill:rgb(248, 250, 252);stroke:none;color:rgb(248, 250, 252);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Cách tính uptime theo khoảng thời gian với lowerbound</title>
<desc style="fill:rgb(248, 250, 252);stroke:none;color:rgb(248, 250, 252);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Trục thời gian với 3 event: một event trước cửa sổ (lowerbound, dùng làm trạng thái bắt đầu), một event bên trong cửa sổ gây chuyển trạng thái ON sang OFF, và một event sau cửa sổ không được dùng để tính</desc>
