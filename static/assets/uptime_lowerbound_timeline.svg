<text x="365" y="368" text-anchor="middle" style="fill:rgb(248, 250, 252);stroke:none;color:rgb(248, 250, 252);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:500;text-anchor:middle;dominant-baseline:auto">Uptime% = ON / (to_time − from_time) × 100</text>
