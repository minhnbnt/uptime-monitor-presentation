<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 260" role="img">
  <title>Cơ chế điều độ Redis ZSET</title>
  <desc>Timeline 10 task theo score (thời điểm chạy). Đường "now" phân tách: bên trái là due task bị Lua script claim và khóa, tiếp theo là next task được peek để tính thời gian sleep, bên phải là các task chưa đến hạn.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <!-- dark background so the figure is dark by default -->
  <rect x="0" y="0" width="680" height="260" rx="12" fill="#0b1120"/>

  <!-- now divider -->
  <line x1="331" y1="38" x2="331" y2="172" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="331" y="26" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="500">now</text>

  <!-- due tasks: dark fill + soft border/text -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <circle cx="70"  cy="108" r="17" fill="#052e16" stroke="#34d399" stroke-width="1.5"/>
    <text x="70"  y="108" text-anchor="middle" dominant-baseline="central" fill="#86efac"  font-size="14" font-weight="600">10</text>
    <circle cx="128" cy="108" r="17" fill="#052e16" stroke="#34d399" stroke-width="1.5"/>
    <text x="128" y="108" text-anchor="middle" dominant-baseline="central" fill="#86efac"  font-size="14" font-weight="600">20</text>
    <circle cx="186" cy="108" r="17" fill="#052e16" stroke="#34d399" stroke-width="1.5"/>
    <text x="186" y="108" text-anchor="middle" dominant-baseline="central" fill="#86efac"  font-size="14" font-weight="600">35</text>
    <circle cx="244" cy="108" r="17" fill="#052e16" stroke="#34d399" stroke-width="1.5"/>
    <text x="244" y="108" text-anchor="middle" dominant-baseline="central" fill="#86efac"  font-size="14" font-weight="600">50</text>
    <circle cx="302" cy="108" r="17" fill="#052e16" stroke="#34d399" stroke-width="1.5"/>
    <text x="302" y="108" text-anchor="middle" dominant-baseline="central" fill="#86efac"  font-size="14" font-weight="600">70</text>
  </g>

  <!-- next task: dark fill + soft border/text -->
  <circle cx="360" cy="108" r="17" fill="#422006" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="108" text-anchor="middle" dominant-baseline="central" fill="#fbbf24" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600">90</text>

  <!-- future tasks: dark fill + soft border/text -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <circle cx="418" cy="108" r="17" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="418" y="108" text-anchor="middle" dominant-baseline="central" fill="#94a3b8" font-size="14" font-weight="500">130</text>
    <circle cx="476" cy="108" r="17" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="476" y="108" text-anchor="middle" dominant-baseline="central" fill="#94a3b8" font-size="14" font-weight="500">170</text>
    <circle cx="534" cy="108" r="17" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="534" y="108" text-anchor="middle" dominant-baseline="central" fill="#94a3b8" font-size="14" font-weight="500">220</text>
    <circle cx="592" cy="108" r="17" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="592" y="108" text-anchor="middle" dominant-baseline="central" fill="#94a3b8" font-size="14" font-weight="500">300</text>
  </g>

  <!-- axis -->
  <line x1="40" y1="158" x2="632" y2="158" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="40" y="176" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="400">score tăng dần</text>

  <!-- region labels -->
  <text x="186" y="205" text-anchor="middle" fill="#34d399" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600">Due tasks (score ≤ now)</text>
  <text x="186" y="222" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="400">Lua claim + khóa (+10s)</text>

  <text x="360" y="205" text-anchor="middle" fill="#f59e0b" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600">Next task</text>
  <text x="360" y="222" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="400">Peek để tính sleep</text>

  <text x="505" y="205" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600">Chưa đến hạn</text>
  <text x="505" y="222" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="400">Không lấy</text>
</svg>
